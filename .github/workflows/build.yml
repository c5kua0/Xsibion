name: Build Xsibion from ZIP

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Xsibion ZIP
        run: |
          mkdir -p project
          unzip -q Xsibion.zip -d project

          if [ -f "project/pom.xml" ]; then
            echo "PROJECT_DIR=project" >> "$GITHUB_ENV"
          else
            ROOT=$(find project -mindepth 1 -maxdepth 1 -type d | head -n 1)

            if [ -n "$ROOT" ] && [ -f "$ROOT/pom.xml" ]; then
              echo "PROJECT_DIR=$ROOT" >> "$GITHUB_ENV"
            else
              echo "ERROR: Could not find pom.xml inside Xsibion.zip"
              exit 1
            fi
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build with Maven
        working-directory: ${{ env.PROJECT_DIR }}
        run: mvn -B clean package

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Xsibion-JAR
          path: ${{ env.PROJECT_DIR }}/target/*.jar
          if-no-files-found: error
